# ulab: persistent state paths created at boot.
#
# The image ships only /usr; these are /var and /etc trees that the
# Kubernetes sysext payloads populate at runtime:
#   /var/lib/extensions.d  - updex staging for downloaded sysext versions
#                            (the /var/lib/extensions link dir is systemd's)
#   /etc/rancher           - k3s reads its config here
#   /etc/k0s               - k0s reads its config here
#   /etc/default           - role-switch env files (/etc/default/k3s-agent,
#                            /etc/default/k0s-worker) live here
#   /etc/kubestellar       - values overrides for ujust kubestellar
d /var/lib/extensions.d 0755 root root -
d /var/lib/extensions 0755 root root -
d /etc/rancher 0755 root root -
d /etc/k0s 0755 root root -
d /etc/default 0755 root root -
d /etc/kubestellar 0755 root root -
